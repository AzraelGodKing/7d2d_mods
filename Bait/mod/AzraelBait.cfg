# Zombie and Animal Bait - settings (server restart needed; admins can also use /thrall config <name> <value> in game)
# taming
FeedsToTame=4
RichBaitMeals=2
FeastBaitMeals=4
FeralBonus=2
RadiatedBonus=4
ChargedBonus=6
AnimalFeedsToTame=3
# Meals per kind of animal (AnimalFeedsToTame above is used for any animal not listed). Edit freely.
AnimalFeeds=animalChicken:1,animalRabbit:1,animalSnake:2,animalPig:2,animalStag:2,animalDoe:2,animalBoar:3,animalCoyote:3,animalBearSmall:4,animalWolf:4,animalZombieDog:4,animalZombieVulture:4,animalMountainLion:5,animalZombieBoar:5,animalBear:6,animalZombieVultureRadiated:6,animalDireWolf:8,animalZombieBear:8
MaxOwned=20
# Kats Special: every player may hold 27 thralls (ignores MaxOwned). A tick box in the Bait UI admin window.
KatsSpecial=true
MaxActive=4
TetheredCountsActive=false
# follow and fight
FollowDistance=5
TeleportDistance=45
TauntRadius=14
TauntShare=0.5
TauntSeconds=8
OwnerCanHurtThralls=false
OthersCanHurtThralls=false
OwnerKillShareRange=30
ThrallsCountTowardSpawnCap=false
DronesIgnoreSpikes=true
AutoStowInVehicle=true
# tether (daycare)
TetherRadius=8
TetherMaxRadius=40
# zombie leveling
ZombieLevels=true
MaxLevel=300
DaysPerLevel=5
KillsPerLevel=8
TierLevelBonus=5
LevelDamagePct=3
LevelToughPct=3
# animal thralls (1.11.0): kept at least at today's wild walker level (zombie animals as feral), plus flat damage/toughness bonuses
AnimalDayLevels=true
AnimalDamagePct=50
AnimalToughPct=50
# care
FeedsPerLevelStep=17
MaxFeeds=27
ReviveSeconds=300
ReviveCostPlain=3
ReviveCostRich=2
ReviveCostFeast=1
# auto-revive (per thrall, /thrall autorevive <n>): plain bait only, taken from the owner's inventory
AutoRevive=true
AutoReviveCost=3
# auto-heal (per thrall, /thrall autoheal <n>): HealBaitCost plain bait, below AutoHealBelowPct health, once per cooldown
AutoHeal=true
AutoHealBelowPct=30
AutoHealCooldownSeconds=20
LowBaitWarning=true
HereCooldownSeconds=30
MaxTeams=8
ReturnUneatenBait=true
# roles (1.10.0): perk slots at these levels (/thrall perk <n> tough|hit|regen|taunt), what each perk does
PerkLevel1=10
PerkLevel2=25
PerkLevel3=50
PerkToughPct=25
PerkHitPct=25
PerkRegenMult=3
PerkResetFeast=1
# guard posts and patrols tell an owner who is away that they are fighting, at most this often
GuardAlertSeconds=60
PatrolMaxPoints=8
# players pick their own blood moon mode with /thrall bloodmoon off|call|fight|both
BloodMoonMode=true
ScoutDistance=30
ScoutRange=40
ScoutCooldownSeconds=30
# /thrall evolve: zombie thralls of this level or more become their feral/radiated version (0 = off)
EvolveLevel=50
EvolveFeastCost=3
# Discord: rare tames, level milestones and evolutions. Needs webhook.txt in this folder (one line, the webhook URL),
# or Blood Moon Sound's discord.txt, which is used when there is no webhook.txt.
WebhookEvents=true
WebhookLevelStep=50
# Bait UI's taming helper (meals needed for what you aim at while holding bait)
TamingHelper=true
HealBaitCost=1
HealPct=40
NewThrallGraceSeconds=8
RegenPctPerTick=1
DefendRange=8
TetherRespectClaims=true
PackSlotsPerAnimal=4
PackSlotsMax=48
LookHp=true
LookHpWild=true
LookHpRange=25
LookHpAngle=12
UseToasts=true
HealthAlerts=true
# Thralls live in AzraelBaitThralls.tsv in the save folder. A copy (plus daily snapshots and one per game version change)
# is kept in <UserDataFolder>/AzraelBait/<world>/<game>. If the save's roster goes missing or empty, it is filled from that copy.
# Set false before wiping a world that keeps the same world and game name, or delete that AzraelBait folder.
RestoreRosterFromBackup=true
# Bait items vanish from inventories if the server ever loads the save without this mod (a host update, a failed install).
# The server keeps a count of each player's and each player-placed chest's bait and puts back a kind that went to zero
# while the player was away or the server was down.
RestoreLostBait=true
Debug=false
